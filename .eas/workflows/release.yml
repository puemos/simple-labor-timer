name: Release to app stores

on:
  push:
    tags:
      - v*
  workflow_dispatch: {}

defaults:
  tools:
    node: 22.21.1
    pnpm: 10.16.1
    corepack: true

jobs:
  verify:
    name: Verify app
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Check Expo package versions
        run: pnpm exec expo install --check
      - name: Run lint, typecheck, and tests
        run: pnpm run verify

  build_android:
    name: Build Android AAB
    needs: [verify]
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS IPA
    needs: [verify]
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit Android to Play Console
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Upload iOS to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
